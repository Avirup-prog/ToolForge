<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Cyan to Indigo Gradient for Brand Mark -->
    <linearGradient id="tfGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Cyan to Emerald Gradient for Forge Spark -->
    <linearGradient id="tfGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="tfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Glass Badge Background -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="#0c1322" stroke="rgba(56, 189, 248, 0.22)" stroke-width="1.2"/>
  
  <!-- Subtle Internal Highlight -->
  <rect x="2.5" y="2.5" width="27" height="13" rx="7" fill="white" fill-opacity="0.025"/>

  <!-- Minimalist Monogram: T & F Forge Structure -->
  <g filter="url(#tfGlow)">
    <!-- Top Horizontal Crossbar (T) with Beveled Corner -->
    <path d="M7 8.5C7 7.67 7.67 7 8.5 7H23.5C24.33 7 25 7.67 25 8.5V9.5C25 10.33 24.33 11 23.5 11H8.5C7.67 11 7 10.33 7 9.5V8.5Z" fill="url(#tfGradPrimary)"/>

    <!-- Vertical Spine / Anvil Trunk -->
    <path d="M12.5 10H16.5V22.5C16.5 23.33 15.83 24 15 24H14C13.17 24 12.5 23.33 12.5 22.5V10Z" fill="url(#tfGradPrimary)"/>

    <!-- Mid Horizontal Arm (F) -->
    <path d="M16.5 14.5H22C22.83 14.5 23.5 15.17 23.5 16V16C23.5 16.83 22.83 17.5 22 17.5H16.5V14.5Z" fill="url(#tfGradAccent)"/>

    <!-- Kinetic Forge Spark / Energy Diamond -->
    <path d="M21.5 20.5L24 23L21.5 25.5L19 23Z" fill="#34d399"/>
  </g>
</svg>
